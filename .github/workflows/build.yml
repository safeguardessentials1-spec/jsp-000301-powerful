name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject sorry / admit / native_decide
        run: |
          if grep -rnwE "sorry|admit|native_decide" --include="*.lean" .; then
            echo "Forbidden token found in Lean sources"
            exit 1
          fi
      - uses: leanprover/lean-action@v1
